name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - run: make dist
      - run: cd bin && sha256sum uvpm-* > checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            bin/uvpm-*
            bin/checksums.txt
